; GridDown Secure Messenger — T-Deck LoRa Radio Firmware
; 
; Build targets:
;   pio run -e tdeck      # LILYGO T-Deck CYPHER-M8K
;   pio run -e t3s3       # LILYGO T3-S3 SX1262
;
; Upload:
;   pio run -e tdeck -t upload

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
lib_deps = 
    jgromes/RadioLib@^6.6.0
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.0
    bodmer/TFT_eSPI@^2.5.43
    mikalhart/TinyGPSPlus@^1.0.3
    sh123/esp32_codec2@^1.0.7
    h2zero/NimBLE-Arduino@^1.4.0
    bodmer/TJpg_Decoder@^1.1.0
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Codec2: enable 1600bps + 3200bps modes (voice quality selection)
    -DCODEC2_MODE_EN_DEFAULT=0
    -DCODEC2_MODE_1600_EN=1
    -DCODEC2_MODE_3200_EN=1
    ; Increase loop task stack for Codec2 (default 8KB is too small)
    -DARDUINO_LOOP_STACK_SIZE=32768
    ; NimBLE: lighter BLE stack (~60KB less flash, ~30KB less RAM than Bluedroid)
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
board_build.filesystem = littlefs

[env:tdeck]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
build_flags = 
    ${env.build_flags}
    -DBOARD_TDECK=1
    ; T-Deck SX1262 pins
    -DLORA_MOSI=41
    -DLORA_MISO=38
    -DLORA_SCK=40
    -DLORA_CS=9
    -DLORA_DIO1=45
    -DLORA_RST=17
    -DLORA_BUSY=13
    ; T-Deck TFT (ST7789 320x240)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DTFT_BL=42
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; T-Deck keyboard I2C
    -DKB_I2C_ADDR=0x55
    -DKB_SDA=18
    -DKB_SCL=8
    ; T-Deck GPS UART
    -DGPS_RX=44
    -DGPS_TX=43
    ; T-Deck battery ADC
    -DBAT_ADC=4
    ; T-Deck peripheral power enable
    -DBOARD_POWERON=10
    ; T-Deck audio: I2S on WS=5, BCK=7, DOUT=6 (defined in ui.cpp)
    ; T-Deck mic:   ES7210 at I2C 0x40, I2S RX: MCLK=48, BCK=47, WS=21, DIN=14
    ; T-Deck SD card
    -DSD_CS=39
    ; T-Deck trackball (optional input)
    -DTRACKBALL_UP=3
    -DTRACKBALL_DOWN=15
    -DTRACKBALL_LEFT=1
    -DTRACKBALL_RIGHT=2
    -DTRACKBALL_CLICK=0

[env:t3s3]
board = esp32-s3-devkitc-1
build_flags = 
    ${env.build_flags}
    -DBOARD_T3S3=1
    ; T3-S3 SX1262 pins
    -DLORA_MOSI=11
    -DLORA_MISO=13
    -DLORA_SCK=12
    -DLORA_CS=7
    -DLORA_DIO1=33
    -DLORA_RST=8
    -DLORA_BUSY=34
    ; T3-S3 TFT (ST7789 170x320)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DTFT_BL=38
    -DSPI_FREQUENCY=40000000
    ; T3-S3 has no keyboard or GPS
    -DNO_KEYBOARD=1
    -DNO_GPS=1
    ; T3-S3 battery ADC
    -DBAT_ADC=1

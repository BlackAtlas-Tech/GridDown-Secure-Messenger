name: Feature request
description: Propose a capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please read the "What we are unlikely to merge" section of CONTRIBUTING.md
        first — particularly the detection-only boundary and airtime constraints.
  - type: textarea
    id: problem
    attributes:
      label: What operational problem does this solve?
      description: Describe the field situation, not the implementation.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations: {required: true}
  - type: dropdown
    id: airtime
    attributes:
      label: Does this require transmitting additional data?
      options: ["No", "Yes — small/infrequent", "Yes — significant", "Not sure"]
    validations: {required: true}
  - type: dropdown
    id: interop
    attributes:
      label: Would this change the packet format, key derivation, or hop sequence?
      options: ["No", "Yes", "Not sure"]
    validations: {required: true}
